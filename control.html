<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e3350d" />
    <title>Jugador · Pokémon Scrabble</title>
    <meta name="description" content="Tus fichas y el tablero de Pokémon Scrabble." />
    <link rel="stylesheet" href="styles.css?v=2" />
    <link rel="stylesheet" href="effects.css?v=2" />
    <link rel="stylesheet" href="control.css?v=3" />
  </head>
  <body class="control">
    <header class="topbar ctrl-top">
      <strong class="brand">
        <svg class="brand-ball" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#fff" stroke="#1f2933" stroke-width="4"/><path d="M3 32 A29 29 0 0 1 61 32 Z" fill="#e3350d" stroke="#1f2933" stroke-width="4"/><rect x="3" y="29" width="58" height="6" fill="#1f2933"/><circle cx="32" cy="32" r="10" fill="#fff" stroke="#1f2933" stroke-width="4"/></svg>
        <span class="brand-poke">Pokémon</span>
        <span class="brand-sub">Scrabble</span>
      </strong>
      <span class="ctrl-top-actions">
        <button type="button" class="btn btn-ghost" id="btnView3d" hidden>▦ Vista 2D</button>
        <span class="ctrl-status" id="ctrlStatus">Sin conectar</span>
      </span>
    </header>

    <main class="ctrl-main">
      <section class="card ctrl-screen" id="scrCode" hidden>
        <h1>Entrar a una sala</h1>
        <p>Escribe el código que aparece en la pantalla principal.</p>
        <form id="codeForm" class="ctrl-code-form" novalidate>
          <input id="codeInput" class="name-input ctrl-code-input" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE" aria-label="Código de sala" />
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
      </section>

      <section class="card ctrl-screen ctrl-center" id="scrConnecting" hidden>
        <div class="ctrl-spinner" aria-hidden="true"></div>
        <p id="connectingText">Conectando con la sala…</p>
      </section>

      <section class="card ctrl-screen" id="scrJoin" hidden>
        <h1>Elige tu posición</h1>
        <div class="ctrl-seats" id="seatList" role="radiogroup" aria-label="Asientos"></div>
        <div id="joinProfile" class="ctrl-profile">
          <label class="seat-label" for="nameInput">Tu nombre</label>
          <input id="nameInput" class="name-input" type="text" maxlength="14" autocomplete="off" placeholder="Tu nombre" />
          <span class="seat-label">Tu Pokémon compañero</span>
          <div class="avatar-grid" id="avatarPicker" role="radiogroup" aria-label="Pokémon compañero"></div>
        </div>
        <p class="ctrl-error" id="joinError" role="alert"></p>
        <button type="button" class="btn btn-primary btn-big" id="btnJoin">Unirme</button>
      </section>

      <section class="card ctrl-screen" id="scrWait" hidden>
        <div class="ctrl-me" id="waitMe"></div>
        <p>Esperando que la partida comience en la pantalla principal…</p>
        <ul class="ctrl-lobby" id="lobbyList"></ul>
        <button type="button" class="btn btn-ghost" id="btnLeave">Cambiar de posición</button>
      </section>

      <section class="ctrl-screen ctrl-play" id="scrPlay" hidden>
        <div class="ctrl-stage">
          <div class="board-frame" id="boardFrame"><div class="board-wrap" id="boardWrap"></div></div>
          <!-- Primera persona desde tu asiento (view3d/). Sin WebGL queda el 2D. -->
          <div class="board3d ctrl-board3d" id="board3dWrap" hidden>
            <div class="board3d-canvas" id="board3dCanvas"></div>
            <div class="board3d-tools">
              <button type="button" class="btn btn-ghost" id="btnCam">🪑 Ver la mesa</button>
            </div>
          </div>
        </div>
        <aside class="ctrl-side">
          <div class="ctrl-scores" id="scoreRow"></div>
          <p class="round-info" id="roundInfo"></p>
          <div id="playPanel"></div>
          <div class="card ctrl-over" id="overCard" hidden></div>
        </aside>
      </section>
    </main>

    <div class="overlay reveal" id="revealDialog" hidden>
      <div id="revealBody"></div>
    </div>
    <div class="turn-pop-layer" id="turnPop" aria-live="polite"></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="vendor/peerjs.min.js"></script>
    <script src="pokedex.js"></script>
    <script src="rules.js"></script>
    <script src="dom.js"></script>
    <script src="board-view.js"></script>
    <script src="play-panel.js"></script>
    <script src="net-protocol.js"></script>
    <script src="control.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <script type="module" src="view3d/view3d.js"></script>
  </body>
</html>
